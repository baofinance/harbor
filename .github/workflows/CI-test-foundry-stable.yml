# this file is copy of lib/bao-base/.github/workflows/CI-test-foundry-stable.yml
# the only modification is in the location of the action.
# TODO: check in the bao-base action to see if this file is up-to-date (modulo directory) with the lib/bao-base version it is a modified copy of
# if not, it should fail.

name: test-foundry-stable

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MAINNET_RPC_URL: https://eth-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_KEY }}

jobs:
  test_foundry_os:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            foundry: stable

          - os: macos-latest
            foundry: stable

          # - os: windows-latest
          #   foundry: stable

      fail-fast: false # ensure all jobs run even if one fails

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify audited sources unchanged
        shell: bash
        run: |
          # Space-separated list of audit tags. Add new tags as audits complete.
          AUDIT_TAGS="audit-2025-07"

          git fetch --tags
          for tag in $AUDIT_TAGS; do
            echo "Verifying src/ against tag: ${tag}"
            git rev-parse --verify "${tag}^{commit}" >/dev/null
            # --diff-filter=DMRT: fail on modified/deleted/renamed/type-changed files,
            # but allow new files (additions) that didn't exist at the audit tag.
            git diff --exit-code --stat --diff-filter=DMRT "${tag}" -- src

            # Verify bao-base's src if corresponding submodule exists
            if [ -d "lib/bao-base-${tag}" ]; then
              echo "Verifying lib/bao-base-${tag}/src/ against tag: ${tag}"
              pushd "lib/bao-base-${tag}" >/dev/null
              git fetch --tags
              git diff --exit-code --stat --diff-filter=DMRT "${tag}" -- src
              popd >/dev/null
            fi
          done

      - name: Run Bao-base CI actions
        uses: ./lib/bao-base/.github/actions/test-foundry
        with:
          foundry: ${{ matrix.foundry }}
