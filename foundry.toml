[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
gas_reports = [
  "LeveragedToken_v1",
  "Minter_v1",
  "ReservePool_v1",
  "FeeSplitter_v1",
]
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./results" },
]
auto_detect_remappings = false # remappings seem to cause problems
evm_version = "Cancun"
optimizer = true
#optimizer_runs = 50
#via_ir = true
# deny_warnings = true # enable to stop compilations if there are warnings

[etherscan]
mainnet = { key = "${ETHERSCAN_KEY}" }

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
