[profile.default]
src = "src"
out = "out"
libs = ["lib"]

ast = true
build_info = true

auto_detect_remappings = false # remappings seem to cause problems
optimizer = true
# optimizer_runs = 200           # 500 builds & tests but 200 deploys

via_ir = true # makes the compiler run 7 times slower
# deny_warnings = true # enable to stop compilations if there are warnings

gas_reports_ignore = [
  "ERC20Mock",
  "ERC1967Proxy",
  "MockBaoAccessControl",
  "TestTokenDistributor",
  "Useful",
  "MockAggregator",
  "MockWrappedPriceOracle",
]
extra_output_files = ["evm.assembly", "ir"]
extra_output = ["evm.assembly", "ir", "storageLayout"]

fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./results" },
  { access = "read-write", path = "./log" },
]

[etherscan]
mainnet = { key = "${ETHERSCAN_KEY}" }

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
local = "http://localhost:8545"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
