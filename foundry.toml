[profile.default]
src = "src"
out = "out"
libs = ["lib"]

auto_detect_remappings = false # remappings seem to cause problems
optimizer = true
optimizer_runs = 200           # 500 builds & tests but 200 deploys

# via_ir = true        # makes the compiler run 7 times slower
deny_warnings = true # enable to stop compilations if there are warnings

gas_reports_ignore = [
  "ERC20Mock",
  "ERC1967Proxy",
  "MockBaoAccessControl",
  "TestTokenDistributor",
  "Useful",
  "MockAggregator",
  "MockWrappedPriceOracle",
]

fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./results" },
  { access = "read-write", path = "./log" },
]

# fast building profile - used during the development cycle
[profile.fast]
out = "out-fast"
libs = ["lib"]

ast = false
build_info = false

via_ir = false        # makes the compiler run 7 times slower
deny_warnings = false # enable to stop compilations if there are warnings

optimizer = true
optimizer_runs = 200 # 500 builds & tests but 200 deploys

extra_output_files = []
extra_output = []


[etherscan]
mainnet = { key = "${ETHERSCAN_KEY}" }

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
local = "http://localhost:8545"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
