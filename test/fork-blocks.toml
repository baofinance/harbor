# Every block a test forks at, by name. BaoTest takes a fork only at a block or transaction listed here.
#
# The fewer the better: each block is a cache of its own, fetched from the provider on every machine's first
# run, and a burst of requests from every suite that forks at it. doctor complains above 8. Name a block for
# what it is, and say why it is needed. `latest` is not written here: it names the highest block listed, so a
# test needing recent state moves forward when a newer block is listed, and a block listed only for being
# recent goes when a newer one arrives. `cast find-block <unix time>` finds the block for a time.

[blocks]
# any block after the last deployment the suites read; which block does not matter
default = 24699497
# the holder capture the v3 upgrade tests read, test/fixtures/holders-25272609: those tests take the block from
# its manifest, and this entry admits it
v3-holder-capture = 25272609
# the frozen-markets capture, script/UpgradeStabilityPool_v2_v3/holders-26248723, at the last block before the
# pause: taken from its manifest likewise
frozen-markets-read = 26248723
# the block after it, where the pause took effect
frozen-markets-paused = 26248724
# BTC::stETH's collateral pool holds a depositor who joined after the v3 holder capture
after-a-depositor-joined = 25691117
# after the USD markets' oracles were deployed, which the default predates: `latest`, until a later block is listed
usd-oracles-live = 26308489

# a fork at a transaction holds the state before it ran, the block's earlier transactions replayed on every run
[transactions]
# the BTC::stETH rebalance dilution exploit
btc-steth-exploit = "0xb8701591c0fa3ee44a9f42379d167261f70e0532f7c0cea6fcda26ef999df3db"
